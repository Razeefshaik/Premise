name: Keep live demo awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Render and run one FalkorDB query
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://premise-43eh.onrender.com/api/graph/overview > /dev/null; then echo "awake"; exit 0; fi
            sleep 20
          done
          echo "::warning::live demo did not respond"
