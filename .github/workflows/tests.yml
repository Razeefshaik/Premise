name: Graph regression suite
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.18.3
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 2s --health-retries 30
    env:
      FALKORDB_PORT: "6379"
      POLL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: python -m pytest -q
      - run: premise-v2 registry-check
      - run: premise-v2 eval --gold
      - run: premise ingest
      - run: premise scenarios
