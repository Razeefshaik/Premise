name: Recorded FalkorDB replay
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    services:
      falkordb:
        image: falkordb/falkordb:v4.18.3
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 2s --health-retries 30
    env:
      POLL_ENABLED: "false"
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - name: Record actual API responses from a fresh graph
        run: python scripts/export_replay.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy recorded replay
        id: deployment
        uses: actions/deploy-pages@v5
